# Config for trying xwayland_scaling nested inside an existing Wayland session.
# Your real sway config is never read:
#   sway -c contrib/x11-scaling/nested-test.conf        (or ./build/sway/sway)
# Needs sway-xwayland-setup on PATH (or give its full path below).

# --- feature under test -----------------------------------------------------
xwayland force
xwayland_scaling auto
# Runs on Xwayland ready and on every scale change, with SWAY_XWAYLAND_SCALE
# set; merges Xft.dpi/Xcursor.size into the X resource database via xrdb.
xwayland_scale_command sway-xwayland-setup

# --- nested output: 2x scale ------------------------------------------------
# WL-1 is the wayland-backend (nested) output: 1600x1200 device pixels =
# 800x600 logical at scale 2.
output WL-1 resolution 1600x1200 scale 2

# --- test bindings ----------------------------------------------------------
set $mod Mod4
bindsym $mod+Return exec xterm -fa 'DejaVu Sans Mono' -fs 10
bindsym $mod+e exec xeyes
bindsym $mod+v exec xev
bindsym $mod+d exec xdpyinfo | grep -E 'dimensions|resolution'
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle
bindsym $mod+Shift+q kill
bindsym $mod+Shift+e exit

# Second output for mixed-scale testing:
#   swaymsg -s $SWAYSOCK create_output   (from a terminal inside the nested session)
# then: output WL-2 scale 1
